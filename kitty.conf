# Place this file at: ~/.config/kitty/kitty.conf
# ----------------------------------------------
# ============================================================
# WINDOW & GRAPHICS DECORATIONS
# ============================================================
wayland_titlebar_color          #316A50
active_border_color             #0b6b1a
inactive_border_color           #888888
draw_window_borders_for_single_window yes
window_border_width             2pt
draw_minimal_borders            no
window_margin_width             0
single_window_margin_width      1
window_padding_width            4
hide_window_decorations         no

remember_window_size            no
initial_window_width            100c
initial_window_height           24c


# ============================================================
# TAB BAR DESIGN & COLORS (Deep Green Palette)
# ============================================================
tab_bar_edge                    bottom
tab_bar_style                   powerline
tab_powerline_style             round

tab_bar_background              #0b2b1a
active_tab_background           #0f4026
active_tab_foreground           #ffffff
active_tab_font_style           bold
inactive_tab_background         #071f12
inactive_tab_foreground         #8ba195
tab_title_template              "{title}"
dynamic_title                   yes


# ============================================================
# TYPOGRAPHY & CURSOR
# ============================================================
font_family                     Liberation Mono
bold_font                       auto
italic_font                     auto
bold_italic_font                auto
font_size                       12.0

cursor_shape                    block
cursor_blink_interval           0


# ============================================================
# BEHAVIOR & CLIPBOARD
# ============================================================
copy_on_select                  yes
clipboard_control               write-clipboard write-primary read-clipboard read-primary
scrollback_lines                10000
scrollback_pager                "less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER"


# ============================================================
# MOUSE MAPPINGS
# ============================================================
mouse_map left click ungrabbed mouse_selection normal
mouse_map wheel_up ungrabbed scroll_line_up
mouse_map wheel_down ungrabbed scroll_line_down
mouse_map right press ungrabbed no_op
mouse_map right click ungrabbed paste_from_clipboard


# ============================================================
# CUSTOM SHORTCUTS (Tab Navigation)
# ============================================================
map ctrl+right next_tab
map ctrl+left  previous_tab

map ctrl+0 remote_control focus-tab --match title:^0$
map ctrl+1 remote_control focus-tab --match title:^1$
map ctrl+2 remote_control focus-tab --match title:^2$
map ctrl+3 remote_control focus-tab --match title:^3$
map ctrl+4 remote_control focus-tab --match title:^4$
map ctrl+5 remote_control focus-tab --match title:^5$
map ctrl+6 remote_control focus-tab --match title:^6$
map ctrl+7 remote_control focus-tab --match title:^7$
map ctrl+8 remote_control focus-tab --match title:^8$
map ctrl+9 remote_control focus-tab --match title:^9$
